<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fractions with Amoha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECFF;--ink:#2B1A4E;--card:#FFFFFF;--soft:#E4DBFF;--line:#2B1A4E;--shadow:#2B1A4E;
  --a:#FF5A8A;--b:#FFB627;--c:#1FBFA3;--d:#4A86FF;--gone:#DCD3F5;--empty:#FFFFFF;
  --good:#0B8A6C;--goodbg:#D4F6EC;--bad:#C22A5C;--badbg:#FFE0E8;--on:#2B1A4E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1030;--ink:#F3EDFF;--card:#2A1D4A;--soft:#3B2B66;--line:#F3EDFF;--shadow:#0A0518;
    --gone:#4A3B78;--empty:#2A1D4A;--good:#3DDBB5;--goodbg:#0F3D34;--bad:#FF86AA;--badbg:#4A1830;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1030;--ink:#F3EDFF;--card:#2A1D4A;--soft:#3B2B66;--line:#F3EDFF;--shadow:#0A0518;
  --gone:#4A3B78;--empty:#2A1D4A;--good:#3DDBB5;--goodbg:#0F3D34;--bad:#FF86AA;--badbg:#4A1830;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-size:19px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:600}
h1{font-size:clamp(34px,8.5vw,54px)}
h2{font-size:clamp(23px,5.4vw,31px)}
h3{font-size:clamp(21px,4.8vw,26px)}
p{margin:.5em 0}
small{font-size:.8em;opacity:.8}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--d);outline-offset:3px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:54px;padding:10px 22px;background:var(--b);color:var(--on);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--shadow);font-weight:600;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--c);color:var(--on)}
.btn.sm{min-height:44px;padding:6px 16px;font-size:.85em;border-radius:14px;box-shadow:0 4px 0 var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:22px}
.row.end{justify-content:flex-end}
.row.mid{justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--shadow);padding:20px 18px}

.hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px;margin:6px 0 26px}
.hero .lead{font-size:1.05em;max-width:30ch}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.tile{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 16px 12px 12px;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.tile:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.tile:disabled{border-style:dashed;box-shadow:none;opacity:.6;cursor:not-allowed}
.tile .mini{flex:none;width:58px}
.tile .tn{font-size:.8em;opacity:.75}
.tile b{font-weight:600;font-size:1.05em;line-height:1.2;display:block}
.tile small{display:block;line-height:1.25}
.s2{margin-top:38px}
.s2 h2{margin-bottom:4px}
.lead2{margin:0 0 16px;opacity:.85}
.parents{margin-top:34px;font-size:.8em;opacity:.85}
.parents summary{cursor:pointer;width:max-content}
.parents .row{justify-content:flex-start;margin-top:10px}

.dots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.dot.now{background:var(--b);transform:scale(1.2)}
.dot.ok{background:var(--c)}
.dot.no{background:var(--a)}
.dot.seen{background:var(--soft)}
.dot.rt{border-style:dashed}
.phase{font-weight:600;padding:6px 14px;border:3px solid var(--line);border-radius:999px;background:var(--card)}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin:14px 0 6px;min-height:150px}
.vis{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0}
.pair{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center}
.pair figure{margin:0;text-align:center}
.pair figcaption{font-weight:600;margin-top:6px}
.ok{color:var(--good)}.no{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px;align-items:center}
.barrow{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;justify-content:center;width:100%;max-width:340px}
.barrow .shape{flex:0 1 auto;min-width:0}
.barrow .lbl{min-width:2.4em;text-align:center;font-size:1.15em}
.multi{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.shape{display:block;height:auto;overflow:visible}
.shape .slice{stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.shape rect.slice{stroke-width:2.5}
.f-e{fill:var(--empty)}.f-a{fill:var(--a)}.f-b{fill:var(--b)}.f-c{fill:var(--c)}.f-d{fill:var(--d)}.f-x{fill:var(--gone)}
.xm{stroke:var(--line);stroke-width:3;stroke-linecap:round;fill:none}
.tap .slice{cursor:pointer}
.tap .slice:hover{filter:brightness(.94)}
.tap .slice:focus-visible{outline:none;stroke:var(--d);stroke-width:6}
.cap{text-align:center;max-width:34ch;margin:4px auto;min-height:2.9em}
.txt{margin-top:10px}
.txt b{font-weight:600}
.lbl{font-weight:500;opacity:.85}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:48px;min-height:48px;padding:4px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);font-weight:600}
.chip.on{background:var(--b);color:var(--on)}
.stepper{display:flex;align-items:center;gap:14px;font-weight:600;font-size:1.3em}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .14em;font-weight:600}
.fr .n{border-bottom:.11em solid currentColor;padding:0 .3em .07em;min-width:1.1em;text-align:center}
.fr .d{padding:.07em .3em 0;min-width:1.1em;text-align:center}
.fr.huge{font-size:3.4rem}
.mx{display:inline-flex;align-items:center;gap:.1em;vertical-align:middle}
.mx .w{font-size:1.35em;font-weight:600;margin-right:.05em}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.3em;font-size:1.5rem;font-weight:600}
.eqrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35em;font-size:1.7rem;font-weight:600;margin:14px 0}
.muted{font-size:.6em;font-weight:400;opacity:.8}
.fracnote{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.85em;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:.85em}
.sw{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-radius:5px;vertical-align:-3px;margin-right:5px}
.sw.a{background:var(--a)}.sw.b{background:var(--b)}.sw.d{background:var(--d)}
.big{font-size:1.9rem}
.cmp{display:inline-flex;align-items:center;gap:.3em;font-size:1.5em;margin-left:.3em;vertical-align:middle}
.cmp .q{width:1.6em;height:1.6em;border:3px dashed var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.say{display:flex;align-items:center;gap:8px;font-size:1.05em}
.trophy{font-size:96px;line-height:1}

.in{width:2.5em;height:2.2em;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.85em;text-align:center;padding:0}
.fr .in{font-size:.7em}
.fr .n .in{margin-bottom:.14em}
.fr .d .in{margin-top:.14em}
.in:disabled{opacity:1;background:var(--soft)}
.in.right{border-color:var(--good);background:var(--goodbg)}
.in.wrong{border-color:var(--bad);background:var(--badbg)}
.q h2{margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.opts.visopts{grid-template-columns:1fr}
.opt{min-height:58px;padding:8px 12px;border:3px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--shadow);font-size:1.05em;font-weight:500;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt .fr{font-size:1.5rem}
.opt .sg{font-size:1.9rem;font-weight:600}
.opt:disabled{cursor:default}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.hintbox{margin-top:14px;padding:12px 14px;border:3px dashed var(--line);border-radius:16px;background:var(--soft)}
.fb{margin-top:18px;padding:14px 16px;border:3px solid;border-radius:18px}
.fb.good{border-color:var(--good);background:var(--goodbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb.retry{border-color:var(--line);background:var(--soft)}
.fb strong{font-weight:600;font-size:1.1em}
.fb .ex{margin-top:4px}
.fb .btn{margin-top:14px}

.result{text-align:center}
.result .starpie{display:flex;justify-content:center;margin:18px 0 8px}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.cert{text-align:center;padding:28px 18px;border:6px double var(--line);border-radius:26px;background:var(--card);box-shadow:0 7px 0 var(--shadow)}
.cert .name{font-size:clamp(42px,12vw,72px);font-weight:700;color:var(--a);line-height:1.1;margin:8px 0}
.cert .cp{display:flex;justify-content:center;margin:12px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff}.noprint{display:none!important}.wrap{padding:0}}

.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.grp{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:3px dashed var(--line);border-radius:14px;max-width:122px;justify-content:center}
.dotc{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);background:var(--empty)}
.dotc.on{background:var(--a)}
.groups.sm .dotc{width:13px;height:13px;border-width:2px}
.groups.sm .grp{gap:3px;padding:5px}
.nl-l,.nl-t{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.nl-d{fill:var(--a);stroke:var(--line);stroke-width:3}
.nl-x{fill:var(--ink);font:600 16px 'Fredoka',system-ui,sans-serif}
.nl-s{fill:var(--ink);font:500 11px 'Fredoka',system-ui,sans-serif}
.hund .slice{stroke-width:1.5}
.pv{display:flex;align-items:flex-end;gap:6px}
.pv>div{display:flex;flex-direction:column;align-items:center}
.pv b{width:2.3em;height:2.1em;border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);font-size:1.25em;font-weight:600}
.pv .dp{font-size:2em;font-weight:700;padding-bottom:.05em}
.pv small{font-size:.65em;opacity:.85}
.pvbox{display:flex;justify-content:center}
.stepper .kv{min-width:1.6em;text-align:center}

.steps{margin:.3em 0 0;padding-left:1.35em}
.steps li{margin:.25em 0}
.fb .ex .steps{margin-top:2px}
.stepsbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.svis{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
.slist{width:100%;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:3px solid var(--line);border-radius:14px;background:var(--card);opacity:.75}
.step.now{background:var(--soft);opacity:1}
.sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--b);color:var(--on);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85em}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const app=typeof document!=='undefined'?document.getElementById('app'):null;
const $=(s,r)=>(r||document).querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,k)=>shuffle(a).slice(0,k);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const range=(x,y)=>{const o=[];for(let i=x;i<=y;i++)o.push(i);return o;};
const fk=(n,d)=>n+'/'+d;
const C=['a','b','c','d'];

/* ---------- storage ---------- */
const KEY='amoha-fractions-v1';
let prog={l:{},all:false,weak:[],s2:{}};
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(p&&typeof p==='object')prog={l:p.l||{},all:!!p.all,weak:Array.isArray(p.weak)?p.weak:[],s2:p.s2&&typeof p.s2==='object'?p.s2:{}};}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(prog));}catch(e){}};
const stars=id=>(prog.l[id]&&prog.l[id].stars)||0;
const CORE=[1,2,3,4,5,6,11,12,13,14,15],STRETCH=[7,8,9],FINAL=10,SEQ=[...CORE,...STRETCH],CT=[...CORE,FINAL];
const labelOf=id=>id===FINAL?'Final challenge':STRETCH.includes(id)?'Stretch '+(STRETCH.indexOf(id)+1):'Lesson '+(CORE.indexOf(id)+1);
const prevOf=id=>{if(CORE.includes(id)){const i=CORE.indexOf(id);return i===0?null:CORE[i-1];}if(id===FINAL||id===STRETCH[0])return CORE[CORE.length-1];return STRETCH[STRETCH.indexOf(id)-1];};
const nextOf=id=>{if(CORE.includes(id)){const i=CORE.indexOf(id);return i<CORE.length-1?CORE[i+1]:FINAL;}if(id===FINAL)return null;return STRETCH[STRETCH.indexOf(id)+1]||null;};
const unlocked=id=>prog.all||prevOf(id)==null||stars(prevOf(id))>0;

/* ---------- html helpers ---------- */
const fr=(n,d,c)=>`<span class="fr${c?' '+c:''}"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><span class="w">${w}</span>${fr(n,d)}</span>`;

/* ---------- shapes ---------- */
function fillsFor(n,parts){const f=Array(n).fill(null);let i=0;parts.forEach(([k,c])=>{for(let j=0;j<k&&i<n;j++)f[i++]=c;});return f;}
const polar=(cx,cy,r,deg)=>{const t=deg*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)];};
function slicePath(cx,cy,r,a0,a1){const[x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);return`M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;}
const tapAttr=(o,i,f)=>o.tap?` tabindex="0" role="button" aria-pressed="${f!=='e'}" aria-label="Part ${i+1}"`:'';
function cross(x,y,k){return`<path class="xm" d="M${(x-k).toFixed(1)} ${(y-k).toFixed(1)}L${(x+k).toFixed(1)} ${(y+k).toFixed(1)}M${(x+k).toFixed(1)} ${(y-k).toFixed(1)}L${(x-k).toFixed(1)} ${(y+k).toFixed(1)}"/>`;}
function pieW(ws,fills,o){o=o||{};
  const S=o.size||180,r=S/2-5,cx=S/2,cy=S/2,tot=ws.reduce((a,b)=>a+b,0);let ang=-90,out='';
  ws.forEach((w,i)=>{const a0=ang,a1=ang+360*w/tot;ang=a1;const f=(fills&&fills[i])||'e';
    if(ws.length===1)out+=`<circle class="slice f-${f}" data-i="0" cx="${cx}" cy="${cy}" r="${r}"${tapAttr(o,i,f)}/>`;
    else out+=`<path class="slice f-${f}" data-i="${i}" d="${slicePath(cx,cy,r,a0,a1)}"${tapAttr(o,i,f)}/>`;
    if(f==='x'){const[px,py]=polar(cx,cy,r*.6,(a0+a1)/2);out+=cross(px,py,Math.min(9,r*.12));}
  });
  return`<svg class="shape${o.tap?' tap':''}" viewBox="0 0 ${S} ${S}" style="width:${S}px;max-width:100%" role="img" aria-label="${o.label||'A circle cut into parts'}">${out}</svg>`;}
const pie=(n,fills,o)=>pieW(Array(n).fill(1),fills,o);
function barW(ws,fills,o){o=o||{};
  const W=o.w||300,H=o.h||54,pad=3,tot=ws.reduce((a,b)=>a+b,0),iw=W-pad*2;let x=pad,out='';
  ws.forEach((w,i)=>{const sw=iw*w/tot,f=(fills&&fills[i])||'e';
    out+=`<rect class="slice f-${f}" data-i="${i}" x="${x.toFixed(2)}" y="${pad}" width="${sw.toFixed(2)}" height="${H-pad*2}"${tapAttr(o,i,f)}/>`;
    if(f==='x')out+=cross(x+sw/2,H/2,Math.min(8,sw/3));
    x+=sw;});
  return`<svg class="shape${o.tap?' tap':''}" viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%" role="img" aria-label="${o.label||'A bar cut into parts'}">${out}</svg>`;}
const bar=(n,fills,o)=>barW(Array(n).fill(1),fills,o);
function multiPie(n,k,o){o=o||{};const cnt=Math.max(1,Math.ceil(k/n));let rem=k,out='';
  for(let i=0;i<cnt;i++){const s=Math.min(n,rem);rem-=s;out+=pie(n,fillsFor(n,[[s,'a']]),{size:o.size||110});}
  return`<div class="multi">${out}</div>`;}
function grid(cols,rows,ac,cr,cell){cell=cell||44;const W=cols*cell+6,H=rows*cell+6;let out='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const ic=c<ac,ir=r<cr,f=ic&&ir?'d':ic?'a':ir?'b':'e';
    out+=`<rect class="slice f-${f}" x="${3+c*cell}" y="${3+r*cell}" width="${cell}" height="${cell}"/>`;}
  return`<svg class="shape" viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%" role="img" aria-label="A grid of ${cols} by ${rows} boxes">${out}</svg>`;}
const barRow=(k,n,c,w)=>`<div class="barrow"><span class="lbl">${fr(k,n)}</span>${bar(n,fillsFor(n,[[k,c]]),{w:w||240,h:44})}</div>`;
const uneven=n=>{const w=Array(n).fill(1);w[rnd(0,n-1)]=rnd(3,4);return w;};

/* ---------- option builders ---------- */
function fracOpts(ans,cands,count){count=count||4;const[an,ad]=ans,key=fk(an,ad);
  const out=[{html:fr(an,ad),value:key}],seen=new Set([key]);
  const ok=([n,d])=>Number.isInteger(n)&&Number.isInteger(d)&&n>0&&d>0&&n*ad!==an*d&&!seen.has(fk(n,d));
  for(const c of shuffle(cands)){if(out.length>=count)break;if(ok(c)){seen.add(fk(c[0],c[1]));out.push({html:fr(c[0],c[1]),value:fk(c[0],c[1])});}}
  let g=0;while(out.length<count&&g++<80){const d=pick([ad,ad+1,ad*2,Math.max(2,ad-1)]),n=rnd(1,d+1);if(ok([n,d])){seen.add(fk(n,d));out.push({html:fr(n,d),value:fk(n,d)});}}
  return{options:shuffle(out),answer:key};}
function txtOpts(correct,wrongs,count){count=count||4;const w=[...new Set(wrongs)].filter(x=>x!==correct);
  return{options:shuffle([correct,...shuffle(w).slice(0,count-1)]).map(t=>({html:t,value:t})),answer:correct};}
const baseFrac=bs=>{bs=bs||[2,3,4,5];for(let i=0;i<60;i++){const b=pick(bs),a=rnd(1,b-1);if(gcd(a,b)===1)return[a,b];}return[1,2];};
const NM={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],8:['eighth','eighths']};
const NK=[2,3,4,5,6,8];
const food=()=>pick(['pizza','cake','pie','chocolate bar']);

/* ---------- extra visuals: counters, hundred grid, number line, place value ---------- */
const groupsHTML=(d,size,k)=>`<div class="groups${d*size>24?' sm':''}" role="img" aria-label="${d} equal groups of ${size}">${Array.from({length:d},(_,g)=>`<div class="grp">${Array.from({length:size},()=>`<span class="dotc${g<k?' on':''}"></span>`).join('')}</div>`).join('')}</div>`;
function hundred(k,size){const cell=(size||200)/10,S=cell*10+6;let out='';
  for(let i=0;i<100;i++){const r=Math.floor(i/10),c=i%10;out+=`<rect class="slice f-${i<k?'a':'e'}" x="${(3+c*cell).toFixed(1)}" y="${(3+r*cell).toFixed(1)}" width="${cell}" height="${cell}"/>`;}
  return`<svg class="shape hund" viewBox="0 0 ${S} ${S}" style="width:${S}px;max-width:100%" role="img" aria-label="A hundred grid with ${k} squares shaded">${out}</svg>`;}
function numLine(d,W,dot,o){o=o||{};const start=o.start||0,x0=22,x1=318,total=d*W,step=(x1-x0)/total,y=38;
  let out=`<line class="nl-l" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
  for(let i=0;i<=total;i++){const x=(x0+i*step).toFixed(1),big=i%d===0;
    out+=`<line class="nl-t" x1="${x}" y1="${y-(big?12:7)}" x2="${x}" y2="${y+(big?12:7)}"/>`;
    if(big)out+=`<text x="${x}" y="${y+34}" text-anchor="middle" class="nl-x">${start+i/d}</text>`;
    else if(o.labels==='all')out+=`<text x="${x}" y="${y+30}" text-anchor="middle" class="nl-s">${i%d}/${d}</text>`;}
  if(dot!=null)out+=`<circle class="nl-d" cx="${(x0+dot*step).toFixed(1)}" cy="${y}" r="9"/>`;
  return`<svg class="shape nl" viewBox="0 0 340 84" style="width:340px;max-width:100%" role="img" aria-label="A number line">${out}</svg>`;}
const dec1=t=>Math.floor(t/10)+'.'+(t%10);
const dec2=h=>Math.floor(h/100)+'.'+String(h%100).padStart(2,'0');
const pv=(o,t,h)=>`<div class="pv"><div><small>ones</small><b>${o}</b></div><div class="dp">.</div><div><small>tenths</small><b>${t}</b></div><div><small>hundredths</small><b>${h}</b></div></div>`;
const aed=c=>'AED '+(c/100).toFixed(2);
const S=(...a)=>'<ol class="steps">'+a.map(x=>`<li>${x}</li>`).join('')+'</ol>';

/* ---------- interactive explorers (learn slides) ---------- */
function chips(box,values,cur,onPick,fmt){fmt=fmt||(v=>v);
  box.innerHTML=values.map((v,i)=>`<button type="button" class="chip${v===cur?' on':''}" data-i="${i}" aria-pressed="${v===cur}">${fmt(v)}</button>`).join('');
  box.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;onPick(values[+b.dataset.i]);const on=box.querySelector('.chip.on');if(on)on.focus();};}
function tapify(box,onToggle){
  box.onclick=e=>{const s=e.target.closest('.slice');if(s)onToggle(+s.dataset.i,false);};
  box.onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;const s=e.target.closest&&e.target.closest('.slice');if(s){e.preventDefault();onToggle(+s.dataset.i,true);}};}
const refocus=(box,i)=>{const s=box.querySelector(`.slice[data-i="${i}"]`);if(s)s.focus();};
const ctl=(label,cls)=>`<div class="ctl"><span class="lbl">${label}</span><div class="chips ${cls}"></div></div>`;

function partsExplorer(el){let n=4;
  el.innerHTML=`<div class="ev"></div>${ctl('Cut the pizza into','ec')}<p class="cap" aria-live="polite"></p>`;
  const draw=()=>{$('.ev',el).innerHTML=pie(n,Array(n).fill('b'),{size:190,label:`A pizza cut into ${n} equal parts`});
    $('.cap',el).innerHTML=`<b>${n} equal parts.</b> Each part is called a <b>${NM[n][0]}</b>. ${n} ${NM[n][1]} make 1 whole.`;
    chips($('.ec',el),NK,n,v=>{n=v;draw();});};
  draw();}

function readExplorer(el){let n=4,sel=new Set();
  el.innerHTML=`<div class="ev"></div>${ctl('Equal parts in all','ec')}<div class="bigfr"></div><p class="cap" aria-live="polite"></p>`;
  const ev=$('.ev',el);
  const draw=fi=>{const f=Array(n).fill(null);sel.forEach(i=>f[i]='a');
    ev.innerHTML=pie(n,f,{size:190,tap:true,label:'Tap a slice to shade it'});
    const k=sel.size;$('.bigfr',el).innerHTML=fr(k,n,'huge');
    $('.cap',el).innerHTML=`<b>Top: ${k}</b> parts shaded.<br><b>Bottom: ${n}</b> equal parts in all.`;
    chips($('.ec',el),NK,n,v=>{n=v;sel=new Set();draw();});
    if(fi!=null)refocus(ev,fi);};
  tapify(ev,(i,key)=>{sel.has(i)?sel.delete(i):sel.add(i);draw(key?i:null);});
  draw();}

function equivExplorer(el){const bases=[[1,2],[1,3],[2,3],[3,4]];let bi=bases[0],k=2;
  el.innerHTML=`${ctl('Start with','eb')}${ctl('Multiply top and bottom by','ek')}<div class="stack ev"></div><div class="eq"></div><p class="cap" aria-live="polite"></p>`;
  const draw=()=>{const[a,b]=bi;
    $('.ev',el).innerHTML=barRow(a,b,'a',300)+barRow(a*k,b*k,'c',300);
    $('.eq',el).innerHTML=`${fr(a,b)} = ${fr(a*k,b*k)}`;
    $('.cap',el).innerHTML=k===1?'Multiplying by 1 changes nothing.':`Top: ${a} × ${k} = ${a*k}.<br>Bottom: ${b} × ${k} = ${b*k}.<br>Same length, so they are equal.`;
    chips($('.eb',el),bases,bi,v=>{bi=v;draw();},v=>v[0]+'/'+v[1]);
    chips($('.ek',el),[1,2,3,4],k,v=>{k=v;draw();});};
  draw();}

function addExplorer(el,sub){let n=6,a=sub?4:2,b=1;
  el.innerHTML=`<div class="ev"></div><div class="eq"></div>${ctl('Slices in the pizza','cn')}${ctl(sub?'Slices you have':'First amount','ca')}${ctl(sub?'Slices you eat':'Second amount','cb')}<p class="cap" aria-live="polite"></p>`;
  const fix=()=>{if(sub){a=Math.min(Math.max(a,2),n-1);b=Math.min(Math.max(b,1),a-1);}else{a=Math.min(Math.max(a,1),n-2);b=Math.min(Math.max(b,1),n-1-a);}};
  const draw=()=>{fix();
    const aV=sub?range(2,n-1):range(1,n-2),bV=sub?range(1,a-1):range(1,n-1-a),res=sub?a-b:a+b;
    $('.ev',el).innerHTML=pie(n,sub?fillsFor(n,[[a-b,'a'],[b,'x']]):fillsFor(n,[[a,'a'],[b,'b']]),{size:170});
    $('.eq',el).innerHTML=`${fr(a,n)} ${sub?'−':'+'} ${fr(b,n)} = ${fr(res,n)}`;
    const sl=x=>x+(x===1?' slice':' slices');
    $('.cap',el).innerHTML=`${sl(a)} ${sub?'−':'+'} ${sl(b)} = ${sl(res)}.<br>The slices are the same size, so the bottom stays <b>${n}</b>.`;
    chips($('.cn',el),[4,5,6,8,10],n,v=>{n=v;draw();});
    chips($('.ca',el),aV,a,v=>{a=v;draw();});
    chips($('.cb',el),bV,b,v=>{b=v;draw();});};
  draw();}

function improperExplorer(el){let d=4,k=5;
  el.innerHTML=`<div class="ev"></div><div class="eq"></div>${ctl('Slices in each pizza','cd')}<div class="ctl"><span class="lbl">Slices we have</span><div class="stepper"><button type="button" class="chip dn" aria-label="One less slice">−</button><span class="kv"></span><button type="button" class="chip up" aria-label="One more slice">+</button></div></div><p class="cap" aria-live="polite"></p>`;
  const draw=()=>{k=Math.min(Math.max(k,1),3*d);const w=Math.floor(k/d),r=k%d;
    $('.ev',el).innerHTML=multiPie(d,k,{size:d>5?96:110});
    $('.kv',el).textContent=k;
    $('.eq',el).innerHTML=k<d?fr(k,d):r===0?`${fr(k,d)} = ${w} whole${w>1?'s':''}`:`${fr(k,d)} = ${mx(w,r,d)}`;
    $('.cap',el).innerHTML=k<d?'Less than 1 whole.':r===0?`${w} full pizza${w>1?'s':''}, nothing extra.`:`<b>${w}</b> full pizza${w>1?'s':''} and <b>${r}</b> extra slice${r>1?'s':''}.`;
    chips($('.cd',el),[2,3,4,5,6,8],d,v=>{d=v;draw();});};
  $('.dn',el).onclick=()=>{k--;draw();};$('.up',el).onclick=()=>{k++;draw();};
  draw();}

function mulWholeExplorer(el){let n=6,a=1,k=3;
  el.innerHTML=`<div class="ev"></div><div class="eq"></div>${ctl('Slices in the pizza','cn')}${ctl('Each amount is','ca')}${ctl('Groups (×)','ck')}<p class="cap" aria-live="polite"></p>`;
  const draw=()=>{a=Math.min(a,n-1);const t=a*k;
    $('.ev',el).innerHTML=t<=n?pie(n,fillsFor(n,Array.from({length:k},(_,i)=>[a,C[i%4]])),{size:170}):multiPie(n,t,{size:100});
    $('.eq',el).innerHTML=k<=4?`${range(1,k).map(()=>fr(a,n)).join(' + ')} = ${fr(t,n)}`:`${k} × ${fr(a,n)} = ${fr(t,n)}`;
    $('.cap',el).innerHTML=`${k} × ${a} = ${t}, and the bottom stays <b>${n}</b>.${t>n?'<br>That is more than 1 whole.':''}`;
    chips($('.cn',el),[4,5,6,8],n,v=>{n=v;draw();});
    chips($('.ca',el),range(1,Math.min(3,n-1)),a,v=>{a=v;draw();},v=>v+'/'+n);
    chips($('.ck',el),[2,3,4,5],k,v=>{k=v;draw();});};
  draw();}

function mulExplorer(el){const F=[[1,2],[1,3],[2,3],[1,4],[3,4]];let f1=F[0],f2=F[0];
  el.innerHTML=`${ctl('First fraction (pink columns)','c1')}${ctl('Second fraction (yellow rows)','c2')}<div class="ev"></div><div class="legend"><span><i class="sw a"></i>first</span><span><i class="sw b"></i>second</span><span><i class="sw d"></i>both</span></div><div class="eq"></div><p class="cap" aria-live="polite"></p>`;
  const draw=()=>{const[a,b]=f1,[c,d]=f2,cell=Math.floor(200/Math.max(b,d));
    $('.ev',el).innerHTML=grid(b,d,a,c,cell);
    $('.eq',el).innerHTML=`${fr(a,b)} × ${fr(c,d)} = ${fr(a*c,b*d)}`;
    $('.cap',el).innerHTML=`${a} × ${c} = ${a*c} blue boxes.<br>${b} × ${d} = ${b*d} boxes in all.`;
    chips($('.c1',el),F,f1,v=>{f1=v;draw();},v=>v[0]+'/'+v[1]);
    chips($('.c2',el),F,f2,v=>{f2=v;draw();},v=>v[0]+'/'+v[1]);};
  draw();}

function roundExplorer(el){let w=3,t=4;
  el.innerHTML=`<div class="ev"></div><div class="eq"></div>${ctl('Whole number','cw')}${ctl('Tenths digit','ct')}<p class="cap" aria-live="polite"></p>`;

    $('.ev',el).innerHTML=numLine(10,1,t,{start:w});
    $('.eq',el).innerHTML=`${w}.${t} rounds to ${r}`;
    $('.cap',el).innerHTML=`The tenths digit is ${t}. ${t>=5?'5 or more: round <b>up</b>.':'4 or less: round <b>down</b>.'}<br>The dot is nearer to ${r}.`;

/* ---------- Lesson 15: using decimals ---------- */
const twoTenths=()=>{let a=rnd(1,9),b=rnd(1,9);while(a===b)b=rnd(1,9);return[a,b];};
const twoHund=()=>{let a=rnd(11,89),b=rnd(11,89);while(a===b||Math.floor(a/10)===Math.floor(b/10))b=rnd(11,89);return[a,b];};
const biggerDecQ=vis=>()=>{const[a,b]=twoTenths(),big=Math.random()<.5,t=big?Math.max(a,b):Math.min(a,b);return{type:'mc',layout:'row',prompt:`Which decimal is ${big?'bigger':'smaller'}?`,visual:vis?`<div class="stack">${barRow(a,10,'a',230).replace(fr(a,10),'0.'+a)}${barRow(b,10,'c',230).replace(fr(b,10),'0.'+b)}</div>`:'',options:shuffle([{html:'0.'+a,value:'0.'+a},{html:'0.'+b,value:'0.'+b}]),answer:'0.'+t,hint:'Compare the tenths digits.',explain:S(`Compare the tenths digits: ${a} and ${b}.`,`${t} is ${big?'bigger':'smaller'}.`,`So 0.${t} is ${big?'bigger':'smaller'}.`)};};
const signDecQ=()=>{const[a,b]=twoHund();return{type:'mc',layout:'row',prompt:`Which sign fits? <span class="cmp">${dec2(a)} <span class="q">?</span> ${dec2(b)}</span>`,options:OPT_SIGN,answer:a<b?'lt':'gt',hint:'Compare the tenths first. If they match, compare the hundredths.',explain:S(`Line up the points.`,`Compare the tenths first: ${Math.floor(a/10)} and ${Math.floor(b/10)}.`,`So ${dec2(a)} ${a<b?'&lt;':'&gt;'} ${dec2(b)}.`)};};
const extremeDecQ=big=>()=>{const set=[],seen=new Set();while(set.length<3){const v=rnd(11,99);if(!seen.has(Math.floor(v/10))){seen.add(Math.floor(v/10));set.push(v);}}const t=big?Math.max(...set):Math.min(...set);return{type:'mc',layout:'row',prompt:`Which is the ${big?'biggest':'smallest'} decimal?`,options:set.map(v=>({html:dec2(v),value:dec2(v)})),answer:dec2(t),hint:'Compare the tenths digits first.',explain:S(`Compare the tenths digit of each number.`,`${dec2(t)} has the ${big?'biggest':'smallest'} tenths digit.`,`So it is the ${big?'biggest':'smallest'}.`)};};
const roundQ=vis=>()=>{const w=rnd(1,9),t=rnd(0,9),r=t>=5?w+1:w;return{type:'mc',layout:'row',prompt:`Round ${w}.${t} to the nearest whole number.`,visual:vis?numLine(10,1,t,{start:w}):'',...txtOpts(String(r),[String(w),String(w+1),String(w-1),String(w+2)].filter(x=>+x>0)),hint:'Look at the tenths digit. 5 or more: round up. 4 or less: round down.',explain:S(`Look at the tenths digit: ${t}.`,`${t>=5?'5 or more: round up.':'4 or less: round down.'}`,`${w}.${t} rounds to ${r}.`)};};
const moneyAddQ=()=>{const a=rnd(2,15)*25,b=rnd(2,15)*25,s=a+b;return{type:'mc',prompt:`A pen costs ${aed(a)} and a rubber costs ${aed(b)}. How much do they cost together?`,...txtOpts(aed(s),[aed(s+50),aed(s-25),aed(s+25),aed(Math.max(25,s-50))]),hint:'Add the dirhams, then add the fils.',explain:S(`Line up the points.`,`Add the fils first, then the dirhams.`,`${aed(a)} + ${aed(b)} = ${aed(s)}.`)};};
const changeQ=()=>{const c=rnd(2,7)*100+pick([0,25,50,75]),pay=(Math.floor(c/500)+1)*500,ch=pay-c;return{type:'mc',prompt:`You pay AED ${(pay/100).toFixed(2)} for a book that costs ${aed(c)}. How much change do you get?`,...txtOpts(aed(ch),[aed(ch+50),aed(ch+100),aed(Math.max(25,ch-25)),aed(ch+25)]),hint:'Take the price away from the money you pay.',explain:S(`Change = the money you pay − the price.`,`${(pay/100).toFixed(2)} − ${(c/100).toFixed(2)}.`,`Change: ${(ch/100).toFixed(2)}.`)};};
const measureQ=()=>{const[a,b,dc,u]=pick([[1,2,'0.5','kg'],[1,4,'0.25','m'],[3,4,'0.75','m'],[1,2,'0.5','litre']]);return{type:'mc',prompt:`${fr(a,b)} of 1 ${u} is the same as ...`,...txtOpts(`${dc} ${u}`,[`0.4 ${u}`,`0.34 ${u}`,`${a}.${b} ${u}`,`0.2 ${u}`,`0.15 ${u}`]),hint:'Remember 1/2 = 0.5, 1/4 = 0.25, 3/4 = 0.75.',explain:S(`Remember: 1/2 = 0.5, 1/4 = 0.25 and 3/4 = 0.75.`,`${fr(a,b)} = ${dc}.`,`So it is ${dc} ${u}.`)};};
const orderDecQ=()=>{const set=[],seen=new Set();while(set.length<3){const v=rnd(11,99);if(!seen.has(Math.floor(v/10))){seen.add(Math.floor(v/10));set.push(v);}}const asc=[...set].sort((x,y)=>x-y),desc=[...asc].reverse();let mixed;do{mixed=shuffle(set);}while(mixed.join()===asc.join()||mixed.join()===desc.join());const show=arr=>arr.map(dec2).join(' , ');
  return{type:'mc',layout:'vis',prompt:'Which list goes from smallest to biggest?',options:shuffle([{html:show(asc),value:'ok'},{html:show(desc),value:'d'},{html:show(mixed),value:'m'}]),answer:'ok',hint:'Compare the tenths digits first.',explain:S(`Compare the tenths digits first.`,`Put the numbers in order, smallest first.`,`${show(asc)}.`)};};

function stepsSlide(steps){return el=>{let n=1;
  el.innerHTML='<div class="stepsbox"><div class="svis"></div><div class="slist" aria-live="polite"></div><button type="button" class="btn sm sbtn"></button></div>';
  const draw=()=>{const cur=steps[n-1];
    $('.svis',el).innerHTML=cur.vis||'';
    $('.slist',el).innerHTML=steps.slice(0,n).map((s,i)=>`<div class="step${i===n-1?' now':''}"><span class="sn">${i+1}</span><div>${s.text}</div></div>`).join('');
    const b=$('.sbtn',el);b.textContent=n<steps.length?'Show the next step':'Start again';
    b.onclick=()=>{n=n<steps.length?n+1:1;draw();};};
  draw();};}

function insertSlides(id,list){ // list of [originalIndex, slide]; inserted before that index
  const sl=Lx(id).slides;[...list].sort((a,b)=>b[0]-a[0]).forEach(([i,s])=>sl.splice(i,0,s));}

/* ---------- answer checking ---------- */
function judge(q,r){
  if(q.type==='num')return{ok:r===q.answer||!!(q.alts&&q.alts.includes(r))};
  if(q.type==='mc'||q.type==='shade')return{ok:r===q.answer};
  if(q.type==='frac'){const[n,d]=r,[A,B]=q.answer;if(d<=0)return{ok:false};const eqv=n*B===A*d;
    if(q.strict)return{ok:n===A&&d===B};
    if(q.simplest){if(eqv&&gcd(n,d)===1)return{ok:true};if(eqv)return{ok:false,retry:'Right amount! Can you make it simpler? Divide the top and the bottom by the same number.'};return{ok:false};}
    if(eqv)return{ok:true,note:(n!==A||d!==B)?`Right! ${fr(n,d)} is the same amount as ${fr(A,B)}.`:''};
    return{ok:false};}
  if(q.type==='mixed'){const[w,n,d]=r,[W,N,D]=q.answer;
    if(d>0&&w===W&&n>0&&n<d&&n*D===N*d)return{ok:true,note:(n!==N||d!==D)?`Right! ${mx(w,n,d)} is the same as ${mx(W,N,D)}.`:''};
    return{ok:false};}
  return{ok:false};}
function answerHTML(q){
  if(q.type==='mc'){const o=q.options.find(x=>x.value===q.answer);return o?o.html:'';}
  if(q.type==='num')return String(q.answer);
  if(q.type==='frac')return fr(q.answer[0],q.answer[1]);
  if(q.type==='mixed')return mx(q.answer[0],q.answer[1],q.answer[2]);
  if(q.type==='shade')return`${q.answer} ${q.answer===1?'part':'parts'}`;
  return'';}

const VKEY='amoha-fractions-view-v1';
let view={name:'home'};
function saveView(){try{localStorage.setItem(VKEY,JSON.stringify(view));}catch(e){}}
function clearSavedView(){try{localStorage.removeItem(VKEY);}catch(e){}}
function validView(v){if(!v||typeof v!=='object')return false;

const sig=q=>q.prompt+'|'+(q.eq||'')+'|'+(q.visual||'')+'|'+JSON.stringify(q.answer);
const wkey=s=>s.lid+':'+s.k+':'+s.i;
function flagWeak(src,run){if(!src)return;const k=wkey(src),e=prog.weak.find(w=>w.key===k);
  if(e)e.run=run;else{prog.weak.push({key:k,src,run});if(prog.weak.length>30)prog.weak.shift();}save();}
function clearWeak(src,run){if(!src)return;const k=wkey(src),n=prog.weak.length;
  prog.weak=prog.weak.filter(w=>!(w.key===k&&w.run!==run));if(prog.weak.length!==n)save();}
function regen(src,prev){const l=LESSONS.find(x=>x.id===src.lid),f=(src.k==='t'?l.tryF:src.k==='m'?l.moreF:l.doF)[src.i];let q;
  for(let n=0;n<8;n++){q={...f(),src};if(sig(q)!==prev)break;}return q;}

function startQuiz(id){
  const l=LESSONS.find(x=>x.id===id),run=Date.now();let qs;
  if(l.final)qs=finalSet().map(q=>({...q,phase:'Final challenge'}));
  else{qs=l.tryF.map((f,i)=>({...f(),src:{lid:id,k:'t',i},phase:'Try it'}));
    qs.push(...sample(range(0,l.doF.length-1),5).map(i=>({...l.doF[i](),src:{lid:id,k:'d',i},phase:'Do it'})));
    const idx=SEQ.indexOf(id),earlier=idx>0?SEQ.slice(1,idx).slice(-5):[];
    earlier.forEach((p,j)=>{const pl=byId(p),pool=[...pl.tryF.map((f,i)=>({f,k:'t',i})),...pl.doF.map((f,i)=>({f,k:'d',i}))];
      sample(pool,j===earlier.length-1?3:2).forEach(({f,k,i})=>qs.push({...f(),src:{lid:p,k,i},phase:'Review',from:p}));});}
  const rt=qs.filter(q=>q.phase==='Review').length;
  go({name:'quiz',qz:{id,section:1,hub:l.final?null:id,qs,base:qs.length,core:qs.length-rt,rt,i:0,score:0,rScore:0,res:[],done:false,run,mode:'lesson'}});
}
function startSection(id,n){
  const l=byId(id),pool=s2Pool(l);
  const qs=sample(pool,Math.min(10,pool.length)).map(x=>({...x.f(),src:{lid:id,k:x.k,i:x.i},phase:'Section '+n}));
  go({name:'quiz',qz:{id,section:n,hub:id,qs,base:qs.length,core:qs.length,rt:0,i:0,score:0,rScore:0,res:[],done:false,run:Date.now(),mode:'section'}});
}
const s2Open=()=>prog.all||CT.every(id=>stars(id)>0);
const MIXW={2:1,3:1,4:3,5:2,6:2,11:2,12:2,13:2,14:2,15:2,7:3};
const s2Pool=l=>[...l.tryF.map((f,i)=>({f,k:'t',i})),...l.doF.map((f,i)=>({f,k:'d',i})),...(l.moreF||[]).map((f,i)=>({f,k:'m',i}))];
function startS2(id){
  const mk=(x,lid)=>({...x.f(),src:{lid,k:x.k,i:x.i},phase:'Practice 2'});let qs;
  if(id==='mix'){qs=[];Object.keys(MIXW).map(Number).forEach(lid=>{sample(s2Pool(byId(lid)),MIXW[lid]).forEach(x=>qs.push(mk(x,lid)));});qs=shuffle(qs);}
  else qs=sample(s2Pool(LESSONS.find(x=>x.id===id)),10).map(x=>mk(x,id));
  go({name:'quiz',qz:{id,qs,base:qs.length,core:qs.length,rt:0,i:0,score:0,rScore:0,res:[],done:false,run:Date.now(),mode:'s2'}});
}
function startMistakes(){
  const qs=sample(prog.weak,10).map(w=>({...regen(w.src,''),phase:'Mistake practice'}));
  if(!qs.length)return;
  go({name:'quiz',qz:{id:0,qs,base:qs.length,core:qs.length,rt:0,i:0,score:0,rScore:0,res:[],done:false,run:Date.now(),mode:'mistakes'}});
}

const PRAISE=['Yes!','Correct!','You got it!','Nice work!','Spot on!','Great job!'];
const INP=lab=>`<input class="in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="${lab}">`;
function ansHTML(q){
  if(q.type==='mc')return`<div class="opts ${q.layout==='vis'?'visopts':''}">${q.options.map(o=>`<button type="button" class="opt" data-v="${o.value}">${o.html}</button>`).join('')}</div>`;
  if(q.type==='shade')return'<div class="vis shadebox"></div><p class="cap shadecount"></p>';
  const f=`<span class="fr"><span class="n">${INP('top number')}</span><span class="d">${INP('bottom number')}</span></span>`;
  if(q.type==='num')return`<div class="eqrow">${(q.eq||'__').replace('__',INP('answer'))}</div>`;
  if(q.type==='frac')return`<div class="eqrow">${q.eq||''}${f}</div>`;
  return`<div class="eqrow">${q.eq||''}${INP('whole number')}${f}</div>`;}

function viewQuiz(){
  const qz=view.qz,q=qz.qs[qz.i];qz.done=false;
  const dots=()=>qz.qs.map((_,i)=>`<span class="dot ${i<qz.res.length?(qz.res[i]?'ok':'no'):i===qz.i?'now':''}${qz.qs[i].retry?' rt':''}"></span>`).join('');
  app.innerHTML=`<main class="wrap">
    <div class="top"><button class="btn sm alt" id="quit">✕ Exit</button><span class="phase">${q.phase==='Review'?'Review: '+labelOf(q.from):q.phase}${q.retry||q.phase==='Review'?'':(q.phase==='Try it'||q.phase==='Do it')?' '+((qz.i%5)+1)+' of 5':' '+(qz.i+1)+' of '+qz.base}</span></div>
    <div class="dots" role="img" aria-label="Question ${qz.i+1}">${dots()}</div>
    <section class="card q"><h2>${q.prompt}</h2>${q.visual?`<div class="vis">${q.visual}</div>`:''}
      <div id="ans">${ansHTML(q)}</div>
      <div class="row" id="acts"><button class="btn sm alt" id="hintbtn">Hint</button>${q.type==='mc'?'':'<button class="btn go" id="check">Check</button>'}</div>
      <div class="hintbox" id="hint" hidden><b>Hint:</b> ${q.hint}</div>
      <div id="fb" aria-live="polite"></div></section>
  </main>`;
  wire('#quit',()=>go(qz.hub?{name:'hub',id:qz.hub}:{name:'home'}));
  wire('#hintbtn',()=>{const h=$('#hint');h.hidden=!h.hidden;});
  const ans=$('#ans');
  const finish=(resp,ui)=>{
    if(qz.done)return;const res=judge(q,resp);
    if(res.retry){$('#fb').innerHTML=`<div class="fb retry"><strong>Almost!</strong> <span>${res.retry}</span></div>`;return;}
    qz.done=true;qz.res.push(res.ok);if(res.ok&&!q.retry){if(q.phase==='Review')qz.rScore++;else qz.score++;}
    let again=false;
    if(res.ok)clearWeak(q.src,qz.run);
    else{flagWeak(q.src,qz.run);
      if((q.tries||0)<2){qz.qs.push({...regen(q.src,sig(q)),phase:'Practice again',retry:true,tries:(q.tries||0)+1});again=true;}}
    const last=qz.i===qz.qs.length-1;
    $('.dots').innerHTML=dots();
    ui(res);
    const acts=$('#acts');if(acts)acts.hidden=true;
    const hb=$('#hint');if(hb)hb.hidden=true;
    $('#fb').innerHTML=`<div class="fb ${res.ok?'good':'bad'}"><strong>${res.ok?pick(PRAISE):'Not quite.'}</strong> ${res.ok?(res.note||''):`The answer is ${answerHTML(q)}.`}${q.explain.startsWith('<ol')?`<div class="ex"><b>Steps</b>${q.explain}</div>`:`<div class="ex">${q.explain}</div>`}${again?`<div class="ex"><b>This kind of question comes back with new numbers.</b>${qz.mode==='lesson'?' Extra practice does not change your score.':''}</div>`:''}
      <button class="btn ${res.ok?'go':''}" id="next">${last?'See my score':'Next question'}</button></div>`;
    const nb=$('#next');nb.onclick=()=>{if(last)finishQuiz();else{qz.i++;render();window.scrollTo(0,0);}};nb.focus();
  };
  if(q.type==='mc'){
    ans.onclick=e=>{const b=e.target.closest('.opt');if(!b||qz.done)return;
      finish(b.dataset.v,res=>{ans.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.v===q.answer)o.classList.add('right');else if(o===b)o.classList.add('wrong');});});};
  }else if(q.type==='shade'){
    const box=$('.shadebox'),cnt=$('.shadecount');let sel=new Set();
    const draw=fi=>{const f=Array(q.n).fill(null);sel.forEach(i=>f[i]='a');const o={tap:!qz.done,label:'Tap parts to shade them'};
      box.innerHTML=q.shape==='pie'?pie(q.n,f,{...o,size:200}):bar(q.n,f,{...o,w:320,h:64});cnt.textContent=`Shaded: ${sel.size}`;if(fi!=null)refocus(box,fi);};
    tapify(box,(i,key)=>{if(qz.done)return;sel.has(i)?sel.delete(i):sel.add(i);draw(key?i:null);});
    draw();
    wire('#check',()=>finish(sel.size,res=>{draw();}));
  }else{
    const ins=[...ans.querySelectorAll('.in')];
    const submit=()=>{const v=ins.map(i=>i.value.trim());
      if(v.some(x=>!/^\d+$/.test(x))){$('#fb').innerHTML='<div class="fb retry">Type a number in every box first.</div>';return;}
      const nums=v.map(Number);
      finish(q.type==='num'?nums[0]:nums,res=>{ins.forEach(i=>{i.disabled=true;i.classList.add(res.ok?'right':'wrong');});});};
    ins.forEach(i=>{i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit();}};});
    wire('#check',submit);
    if(ins[0])ins[0].focus({preventScroll:true});
  }
}

function finishQuiz(){
  const qz=view.qz;
  if(qz.mode==='s2'){const key=String(qz.id),cur=prog.s2[key],sc=qz.score,tot=qz.base;
    if(!cur||sc/tot>cur.best/cur.total){prog.s2[key]={best:sc,total:tot};save();}
    go({name:'result',mode:'s2',id:qz.id,score:sc,total:tot});return;}
  if(qz.mode==='mistakes'){go({name:'result',mode:'mistakes',score:qz.score,total:qz.base});return;}
  if(qz.mode==='section'){const key=qz.id+':'+qz.section,cur=prog.s2[key],sc=qz.score,tot=qz.base;
    if(!cur||sc/tot>cur.best/cur.total){prog.s2[key]={best:sc,total:tot};save();}
    go({name:'result',mode:'section',id:qz.id,section:qz.section,score:sc,total:tot});return;}
  const score=qz.score,pass=score>=8,st=pass?(score===10?3:score===9?2:1):0;
  if(pass){const cur=prog.l[qz.id]||{stars:0,best:0};
    prog.l[qz.id]={stars:Math.max(cur.stars,st),best:Math.max(cur.best,score),date:cur.date||new Date().toISOString()};save();}
  go({name:'result',id:qz.id,score,st,pass,rs:qz.rScore,rt:qz.rt,hub:qz.hub});
}

    <p>${msg}</p>

function viewCert(){
  const total=CT.reduce((s,id)=>s+stars(id),0),d=prog.l[10]&&prog.l[10].date?new Date(prog.l[10].date):new Date();
  let date='';try{date=d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){date=d.toDateString();}
  app.innerHTML=`<main class="wrap">
    <div class="top noprint"><button class="btn sm alt" id="home">← Lessons</button></div>
    <section class="cert"><h2>Certificate of Fraction Power</h2><p>This certificate is given to</p><div class="name">Amoha</div>
    <p>who can read, compare, add and subtract fractions, find fractions of amounts, and work with tenths, hundredths and decimals.</p>
    <div class="cp">${pie(10,Array(10).fill('a'),{size:110,label:'A full pie'})}</div>
    <div class="prog" style="justify-content:center"><b>${total}</b> of ${3*CT.length} stars</div><p>${date}</p></section>
    <div class="row mid noprint"><button class="btn go" id="print">Print certificate</button></div></main>`;
  wire('#home',()=>go({name:'home'}));
  wire('#print',()=>{try{window.print();}catch(e){}});
}

(function restoreView(){try{const raw=localStorage.getItem(VKEY);if(!raw)return;const v=JSON.parse(raw);
  if(validView(v)){if(v.name==='quiz')v.qz.done=false;view=v;}}catch(e){}})();
if(typeof module!=='undefined')module.exports={LESSONS,judge,finalSet,fracOpts,txtOpts,validView};
if(app)render();
})();
</script>
